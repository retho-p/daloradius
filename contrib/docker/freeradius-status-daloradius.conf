# Internal daloRADIUS service-status listener.
# The generated client is restricted to the Docker network and the listener
# accepts Status-Server packets only.
server daloradius-status {
    listen {
        type = status
        ipaddr = 0.0.0.0
        port = 18122
    }

    client daloradius_web {
        ipaddr = __DALO_STATUS_CLIENT_NETWORK__
        secret = "__DALO_STATUS_CLIENT_SECRET__"
        require_message_authenticator = yes
    }

    authorize {
        ok

        Autz-Type Status-Server {
            ok
        }
    }
}
